<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11142b">
  <title>Contact — Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101326; color: #f7f6ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow-x: hidden; padding: 6rem 1rem 2rem; background: radial-gradient(ellipse at 16% 18%, #5142a244, transparent 34rem), radial-gradient(ellipse at 86% 82%, #08a9a633, transparent 30rem), #101326; }
    .orb { position: fixed; width: 24rem; aspect-ratio: 1; border: 1px solid #ffffff12; border-radius: 50%; pointer-events: none; animation: drift 16s ease-in-out infinite alternate; }
    .orb::before, .orb::after { content: ""; position: absolute; inset: 2.5rem; border: 1px solid #ffffff0d; border-radius: inherit; }
    .orb::after { inset: 5rem; } .orb.one { top: -13rem; left: -9rem; } .orb.two { right: -15rem; bottom: -14rem; animation-delay: -7s; }
    nav { position: fixed; z-index: 2; top: 1.25rem; left: 50%; transform: translateX(-50%); display: flex; gap: .35rem; padding: .4rem; border: 1px solid #ffffff20; border-radius: 999px; background: #171a32cc; backdrop-filter: blur(14px); }
    nav a { padding: .65rem 1rem; border-radius: 999px; color: #c9c8e5; text-decoration: none; font-size: .9rem; transition: background 180ms ease, color 180ms ease; }
    nav a:hover, nav a[aria-current="page"] { color: #fff; background: #ffffff16; }
    main { position: relative; width: min(90vw, 760px); padding: clamp(2rem, 7vw, 5.5rem); border: 1px solid #ffffff20; border-radius: 32px; background: linear-gradient(145deg, #ffffff12, #ffffff06); box-shadow: 0 30px 100px #05071380, inset 0 1px #ffffff1a; backdrop-filter: blur(18px); animation: arrive 900ms cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display: inline-flex; align-items: center; gap: .55rem; padding: .55rem .9rem; border: 1px solid #ffffff1c; border-radius: 999px; color: #c9c8e5; background: #ffffff09; font-size: .76rem; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    .spark { color: #82f4db; font-size: 1rem; }
    h1 { margin: 1.6rem 0 1rem; font-size: clamp(3rem, 9vw, 5.8rem); line-height: .98; letter-spacing: -.075em; }
    h1 span { color: transparent; background: linear-gradient(100deg, #9c91ff 10%, #77e6db 90%); background-clip: text; -webkit-background-clip: text; }
    p { max-width: 38rem; margin: 0; color: #aaaec9; font-size: clamp(1rem, 2.5vw, 1.12rem); line-height: 1.8; }
    .contact-card { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 2rem; padding: 1.2rem 1.35rem; border: 1px solid #ffffff18; border-radius: 18px; background: #ffffff08; }
    .contact-card span { display: block; margin-bottom: .3rem; color: #9da2c0; font-size: .82rem; }
    .contact-card a { color: #82f4db; text-decoration: none; font-weight: 650; }
    .contact-card a:hover { text-decoration: underline; }
    .back { display: inline-flex; align-items: center; gap: .55rem; margin-top: 1.8rem; color: #c9c8e5; text-decoration: none; }
    .back:hover { color: white; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate(3rem, 2rem) rotate(14deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div><div class="orb two" aria-hidden="true"></div>
  <nav aria-label="Main navigation"><a href="helloworld.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <main>
    <div class="eyebrow"><span class="spark" aria-hidden="true">✦</span> Let’s start a conversation</div>
    <h1>Say <span>hello.</span></h1>
    <p>Have a thought, a question, or just want to say hi? I’d love to hear from you. Drop a note and let’s make something good happen.</p>
    <div class="contact-card">
      <div><span>Send a note</span><a href="akashkaranam29@gmail.com">hello@example.com</a></div>
      <span aria-hidden="true" style="font-size:1.5rem;color:#82f4db">↗</span>
    </div>
    <a class="back" href="helloworld.html"><span aria-hidden="true">←</span> Back to the welcome page</a>
  </main>
</body>
</html>
